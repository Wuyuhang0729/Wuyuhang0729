<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="100%" role="img" aria-label="分隔线">
  <title>分隔线</title>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2997ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3a3a3c" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4.5" width="1200" height="1" fill="#3a3a3c"/>
  <rect x="0" y="4" width="1200" height="2" fill="url(#sweep)"/>
</svg>
