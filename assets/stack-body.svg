<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" role="img" aria-label="技术栈：主力 Unity、C#、ShaderLab / HLSL；也在用 Unreal、C++、TypeScript / Node、Blender">
  <title>技术栈</title>
  <desc>静态降级：内容在无动画环境下同样完整可见</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0.2;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.2;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0s" fill="freeze"/>
     <animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="0.9s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <text x="600" y="62" text-anchor="middle" font-size="21" font-weight="500" letter-spacing="1" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">主力　　Unity　·　C#　·　ShaderLab / HLSL</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.16s" fill="freeze"/>
     <animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="0.9s" begin="0.16s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <text x="600" y="116" text-anchor="middle" font-size="21" font-weight="400" letter-spacing="1" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">也在用　Unreal　·　C++　·　TypeScript / Node　·　Blender</text>
  </g>
  <line y1="158" y2="158" x1="600" x2="600" stroke="url(#flow)" stroke-width="1.4" stroke-linecap="round">
       <animate attributeName="x1" values="600;450" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
       <animate attributeName="x2" values="600;750" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
     </line>
</svg>
