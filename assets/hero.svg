<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="吴宇杭 —— Gameplay Programmer / Combat Systems">
  <title>吴宇杭 —— Gameplay Programmer / Combat Systems</title>
  <desc>静态降级：名字、职称、细线与标语；支持动画的浏览器里会依次淡入、细线自中心展开</desc>

  <defs>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2d2d7"/>
      <stop offset="0.5" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#d2d2d7"/>
      <animate attributeName="x1" values="-1.5;0.2;-1.5" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.5;1.4;-0.5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- 名字 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="1.2s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <text x="600" y="146" text-anchor="middle" font-size="94" font-weight="300" letter-spacing="6" fill="#1d1d1f"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">吴宇杭</text>
  </g>

  <!-- 职称 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="1.2s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <text x="600" y="196" text-anchor="middle" font-size="18" font-weight="500" letter-spacing="7" fill="#86868b"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">GAMEPLAY PROGRAMMER · COMBAT SYSTEMS</text>
  </g>

  <!-- 细线：自中心向两侧展开，之后保持缓慢流动 -->
  <line y1="240" y2="240" x1="600" x2="600" stroke="url(#hairline)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x1" values="600;250" dur="1.4s" begin="1.05s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <animate attributeName="x2" values="600;950" dur="1.4s" begin="1.05s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
  </line>

  <!-- 标语 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="1.4s" begin="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
    <text x="600" y="312" text-anchor="middle" font-size="46" font-weight="300" letter-spacing="4" fill="#1d1d1f"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">保持学习</text>
  </g>

  <!-- 副标语 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.95s" fill="freeze"/>
    <text x="600" y="356" text-anchor="middle" font-size="21" font-weight="400" letter-spacing="3" fill="#86868b"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">机制 · 相机 · 演出 · 节奏 · 反馈 · 信息</text>
  </g>
</svg>
