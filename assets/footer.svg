<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" role="img" aria-label="@Wuyuhang0729 · © 2026 吴宇杭">
  <title>@Wuyuhang0729</title>
  <desc>静态降级：内容在无动画环境下同样完整可见</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0.2;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.2;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.05s" fill="freeze"/>
    <text x="600" y="46" text-anchor="middle" font-size="15" font-weight="400" letter-spacing="2" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">@Wuyuhang0729　·　© 2026 吴宇杭</text>
  </g>
</svg>
